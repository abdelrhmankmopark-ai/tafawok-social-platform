<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المعلم الذكي | منصة التفوق</title>
<link rel="stylesheet" href="css/style.css">
<style>
body {font-family:Tahoma,Arial;background:#eef4fb;margin:0;color:#17365d}
header {background:#1455a0;color:white;text-align:center;padding:22px}
.chat {max-width:750px;margin:25px auto;background:white;border-radius:20px;padding:18px;box-shadow:0 5px 25px #0002}
.messages {height:55vh;overflow-y:auto;padding:10px}
.msg {padding:12px 15px;margin:12px 0;border-radius:15px;line-height:1.8;white-space:pre-wrap}
.user {background:#dcecff;margin-right:15%;text-align:right}
.bot {background:#f0f2f5;margin-left:15%;text-align:right}
.form {display:flex;gap:8px}
input {flex:1;min-width:0;padding:14px;border:1px solid #ccc;border-radius:12px;font-size:16px}
button {background:#1455a0;color:white;border:0;padding:13px 18px;border-radius:12px;font-size:16px}
.status {text-align:center;color:#777;font-size:13px;margin:10px}
</style>
</head>
<body><header>
<h2>🤖 المعلم الذكي</h2>
<p>مساعدك في الدراسات الاجتماعية</p>
</header><div class="chat">
<div class="messages" id="messages">
<div class="msg bot">أهلاً بك! أنا المعلم الذكي لمنصة التفوق 📚
اسألني عن أي موضوع في الدراسات الاجتماعية.</div>
</div><div class="status" id="status">جاهز لاستقبال سؤالك</div><form class="form" id="chatForm">
<input id="question" placeholder="اكتب سؤالك هنا..." autocomplete="off">
<button type="submit">إرسال</button>
</form>
</div><script src="script.js"></script><script>
const form = document.getElementById("chatForm");
const input = document.getElementById("question");
const messages = document.getElementById("messages");
const statusText = document.getElementById("status");

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

form.addEventListener("submit", async function(e) {
    e.preventDefault();

    const question = input.value.trim();
    if (!question) return;

    addMessage(question, "user");
    input.value = "";
    statusText.textContent = "المعلم يفكر...";

    try {
        const answer = await askTafaWok(question);
        addMessage(answer || "لم يصل رد.", "bot");
        statusText.textContent = "تم الرد بنجاح";
    } catch(error) {
        addMessage("حدث خطأ: " + error.message, "bot");
        statusText.textContent = "تعذر الاتصال";
    }
});
</script></body>
</html>
