<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الملف الشخصي | منصة التفوق</title>
<link rel="stylesheet" href="../css/style.css"><style>
*{box-sizing:border-box}

body{
font-family:Arial,sans-serif;
padding:20px;
min-height:100vh;
}

.profile{
max-width:600px;
margin:40px auto;
padding:25px;
border-radius:22px;
background:rgba(255,255,255,.15);
border:1px solid rgba(255,255,255,.3);
box-shadow:0 10px 30px #0002;
}

.header{
text-align:center;
margin-bottom:25px;
}

.avatar{
width:110px;
height:110px;
margin:auto;
border-radius:50%;
background:#155eef;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:45px;
overflow:hidden;
border:4px solid white;
box-shadow:0 5px 15px #0002;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
display:none;
}

.photo-controls{
text-align:center;
margin:15px 0 25px;
}

.photo-btn{
display:inline-block;
padding:11px 20px;
border-radius:12px;
background:#155eef;
color:white;
cursor:pointer;
border:none;
font-size:15px;
}

.photo-btn:disabled{
opacity:.6;
cursor:not-allowed;
}

#photoInput{
display:none;
}

#photoMessage{
font-size:13px;
margin-top:10px;
}

.info{
padding:15px;
margin:12px 0;
border-radius:12px;
background:rgba(255,255,255,.15);
}

.info span{
display:block;
font-size:13px;
opacity:.8;
margin-bottom:8px;
}

.info strong{
font-size:17px;
word-break:break-word;
}

.status{
display:inline-block;
padding:7px 15px;
border-radius:20px;
background:#198754;
color:white;
}

.back{
display:block;
text-align:center;
margin-top:25px;
padding:13px;
border-radius:12px;
background:#155eef;
color:white;
text-decoration:none;
}

#loading{
text-align:center;
margin-top:80px;
}

#error{
display:none;
text-align:center;
padding:15px;
color:white;
background:#b52d3a;
border-radius:12px;
}
</style></head><body><div id="loading">جاري تحميل بياناتك...</div>
<div id="error"></div><main class="profile" id="profile" hidden><div class="header"><div class="avatar">
<span id="avatarIcon">👤</span>
<img id="avatarImage" alt="الصورة الشخصية">
</div><h2>الملف الشخصي</h2>
<p>منصة التفوق للدراسات الاجتماعية</p></div><div class="photo-controls"><label for="photoInput" class="photo-btn" id="photoButton">
📷 تغيير الصورة الشخصية
</label><input
type="file"
id="photoInput"
accept="image/jpeg,image/png,image/webp"

«»

<p id="photoMessage">اختر صورة من هاتفك (بحد أقصى 5 ميجابايت).</p></div><div class="info">
<span>اسم الطالب</span>
<strong id="studentName">---</strong>
</div><div class="info">
<span>البريد الإلكتروني</span>
<strong id="studentEmail">---</strong>
</div><div class="info">
<span>حالة الحساب</span>
<strong id="studentStatus" class="status">---</strong>
</div><div class="info">
<span>تاريخ إنشاء الحساب</span>
<strong id="createdAt">---</strong>
</div><a href="dashboard.html" class="back">
⬅ العودة إلى لوحة الطالب
</a></main><script type="module">

import {auth,db} from "../firebase-config.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

import {
doc,
getDoc,
updateDoc
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const loading=document.getElementById("loading");
const profile=document.getElementById("profile");
const errorBox=document.getElementById("error");

const photoInput=document.getElementById("photoInput");
const photoButton=document.getElementById("photoButton");
const photoMessage=document.getElementById("photoMessage");

const avatarImage=document.getElementById("avatarImage");
const avatarIcon=document.getElementById("avatarIcon");

let currentUser=null;

function showPhoto(photoURL){

if(photoURL && photoURL.startsWith("data:image/")){

avatarImage.src=photoURL;
avatarImage.style.display="block";
avatarIcon.style.display="none";

}else{

avatarImage.removeAttribute("src");
avatarImage.style.display="none";
avatarIcon.style.display="block";

}

}

// ضغط الصورة لتناسب مساحة Firestore
function compressImage(file){

return new Promise((resolve,reject)=>{

const image=new Image();
const objectURL=URL.createObjectURL(file);

image.onload=()=>{

const maxSize=320;

let width=image.width;
let height=image.height;

if(width>height && width>maxSize){

height=Math.round(height*maxSize/width);
width=maxSize;

}else if(height>maxSize){

width=Math.round(width*maxSize/height);
height=maxSize;

}

const canvas=document.createElement("canvas");

canvas.width=width;
canvas.height=height;

const context=canvas.getContext("2d");

context.drawImage(image,0,0,width,height);

URL.revokeObjectURL(objectURL);

let quality=0.75;

function makeImage(){

canvas.toBlob(async(blob)=>{

if(!blob){

reject(new Error("تعذر ضغط الصورة."));
return;

}

if(blob.size>120000 && quality>0.35){

quality-=0.1;
makeImage();
return;

}

if(blob.size>140000){

reject(new Error("حجم الصورة كبير. اختر صورة أصغر."));
return;

}

const reader=new FileReader();

reader.onload=()=>resolve(reader.result);
reader.onerror=()=>reject(new Error("تعذر قراءة الصورة."));

reader.readAsDataURL(blob);

},"image/jpeg",quality);

}

makeImage();

};

image.onerror=()=>{

URL.revokeObjectURL(objectURL);
reject(new Error("الصورة غير صالحة."));

};

image.src=objectURL;

});

}

// تحميل بيانات الطالب
onAuthStateChanged(auth,async(user)=>{

if(!user){

location.replace("../login.html");
return;

}

currentUser=user;

try{

const studentRef=doc(db,"students",user.uid);
const studentSnap=await getDoc(studentRef);

if(!studentSnap.exists()){

throw new Error("بيانات الطالب غير موجودة.");

}

const data=studentSnap.data();

if(data.status==="disabled"){

alert("حسابك موقوف حالياً. تواصل مع الأستاذ.");
location.replace("../login.html");
return;

}

document.getElementById("studentName").textContent=
data.name||user.displayName||"الطالب";

document.getElementById("studentEmail").textContent=
data.email||user.email||"غير متوفر";

document.getElementById("studentStatus").textContent=
data.status==="active"?"نشط":"غير معروف";

if(data.createdAt && data.createdAt.toDate){

document.getElementById("createdAt").textContent=
data.createdAt.toDate().toLocaleDateString("ar-EG");

}else{

document.getElementById("createdAt").textContent=
"غير متوفر";

}

showPhoto(data.photoURL);

loading.hidden=true;
profile.hidden=false;

}catch(error){

console.error(error);

loading.hidden=true;
errorBox.style.display="block";

errorBox.textContent=
"حدث خطأ أثناء تحميل بيانات الحساب. حاول مرة أخرى.";

}

});

// تغيير الصورة وحفظها
photoInput.addEventListener("change",async()=>{

const file=photoInput.files[0];

if(!file || !currentUser)return;

if(!file.type.startsWith("image/")){

photoMessage.textContent="من فضلك اختر ملف صورة صحيح.";
return;

}

if(file.size>5*1024*1024){

photoMessage.textContent="حجم الصورة يجب ألا يتجاوز 5 ميجابايت.";
return;

}

photoButton.style.pointerEvents="none";
photoButton.style.opacity=".6";

photoMessage.textContent="جاري تجهيز الصورة وحفظها...";

try{

const compressedPhoto=await compressImage(file);

const studentRef=doc(db,"students",currentUser.uid);

await updateDoc(studentRef,{
photoURL:compressedPhoto
});

showPhoto(compressedPhoto);

photoMessage.textContent="✅ تم حفظ صورتك الشخصية بنجاح.";

}catch(error){

console.error(error);

photoMessage.textContent=
"تعذر حفظ الصورة. تأكد من الاتصال بالإنترنت وحاول مرة أخرى.";

alert("حدث خطأ أثناء حفظ الصورة. راجع رسالة الخطأ في وحدة التحكم.");

}finally{

photoButton.style.pointerEvents="auto";
photoButton.style.opacity="1";
photoInput.value="";

}

});

</script></body>
</html>
