<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الامتحانات | منصة التفوق</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #0f172a;
      color: white;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
    }

    h1 {
      color: #38bdf8;
      font-size: 25px;
    }

    .back, .refresh {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      cursor: pointer;
    }

    .exam-card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    .exam-card h2 {
      color: #38bdf8;
      margin-top: 0;
    }

    .description {
      color: #cbd5e1;
      line-height: 1.7;
    }

    .info {
      color: #94a3b8;
      font-size: 14px;
      margin: 15px 0;
    }

    .start-btn {
      display: block;
      text-align: center;
      background: #16a34a;
      color: white;
      padding: 13px;
      border-radius: 10px;
      text-decoration: none;
    }

    #message {
      text-align: center;
      color: #facc15;
      margin: 25px 0;
    }

    .empty {
      background: #1e293b;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      color: #cbd5e1;
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>📝 امتحاناتي</h1>
    <div>
      <a class="back" href="dashboard.html">رجوع</a>
      <button class="refresh" id="refreshBtn">تحديث</button>
    </div>
  </header>

  <div id="message">جارٍ تحميل الامتحانات...</div>

  <div id="examsList"></div>

</div>

<script type="module">

import { auth, db } from "../firebase-config.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

import {
  collection,
  getDocs,
  query,
  where,
  orderBy
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";


const message = document.getElementById("message");
const examsList = document.getElementById("examsList");
const refreshBtn = document.getElementById("refreshBtn");

let currentUser = null;


onAuthStateChanged(auth, async (user) => {

  if (!user) {
    location.href = "../login.html";
    return;
  }

  currentUser = user;

  await loadExams();

});


async function loadExams() {

  message.textContent = "جارٍ تحميل الامتحانات...";
  examsList.innerHTML = "";

  try {

    let snapshot;

    try {

      const examsQuery = query(
        collection(db, "exams"),
        where("isPublished", "==", true),
        orderBy("createdAt", "desc")
      );

      snapshot = await getDocs(examsQuery);

    } catch (error) {

      console.warn("تعذر الترتيب، جاري المحاولة بدونه:", error);

      const examsQuery = query(
        collection(db, "exams"),
        where("isPublished", "==", true)
      );

      snapshot = await getDocs(examsQuery);

    }

    if (snapshot.empty) {

      message.textContent = "";

      examsList.innerHTML = `
        <div class="empty">
          لا توجد امتحانات منشورة حاليًا.
          <br><br>
          تابع الصفحة لمعرفة الامتحانات الجديدة.
        </div>
      `;

      return;
    }

    message.textContent = "";

    snapshot.forEach((examDoc) => {

      const exam = examDoc.data();
      const examId = examDoc.id;

      const card = document.createElement("div");
      card.className = "exam-card";

      const title = document.createElement("h2");
      title.textContent = exam.title || "امتحان بدون عنوان";

      const description = document.createElement("p");
      description.className = "description";
      description.textContent = exam.description || "لا يوجد وصف.";

      const info = document.createElement("div");
      info.className = "info";

      const duration = Number(
        exam.durationMinutes || exam.duration || 0
      );

      info.textContent =
        "عدد الأسئلة: " + (exam.questionCount || 0) +
        " | مدة الامتحان: " + duration + " دقيقة";

      const startButton = document.createElement("a");
      startButton.className = "start-btn";
      startButton.textContent = "ابدأ الامتحان";

      startButton.href =
        "solve-exam.html?id=" + encodeURIComponent(examId);

      card.appendChild(title);
      card.appendChild(description);
      card.appendChild(info);
      card.appendChild(startButton);

      examsList.appendChild(card);

    });

  } catch (error) {

    console.error(error);

    message.textContent =
      "حدث خطأ أثناء تحميل الامتحانات. حاول مرة أخرى.";

  }

}


refreshBtn.addEventListener("click", loadExams);

</script>

</body>
</html>
