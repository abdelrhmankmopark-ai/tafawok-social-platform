<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الإعلانات | منصة التفوق</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { padding: 20px; }
    main { max-width: 850px; margin: 25px auto; }
    header, .announcement {
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 20px;
      background: rgba(255,255,255,.2);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,.3);
    }
    .back { display: inline-block; margin-bottom: 15px; }
    .announcement h3 { margin-top: 0; }
    .date { opacity: .7; font-size: 13px; }
    #message { text-align: center; padding: 20px; }
  </style>
</head>
<body>
<main>
  <a class="back" href="dashboard.html">⬅ العودة للوحة الطالب</a>  <header>
    <h1>📢 الإعلانات</h1>
    <p>تابع آخر أخبار وتنبيهات الأستاذ.</p>
  </header>  <div id="message">جاري تحميل الإعلانات...</div>
  <section id="announcements"></section>
</main><script type="module">
  import { auth, db } from "../firebase-config.js";
  import { onAuthStateChanged } from
    "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
  import {
    collection, getDocs, query, orderBy
  } from
    "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

  const message = document.getElementById("message");
  const container = document.getElementById("announcements");

  onAuthStateChanged(auth, async user => {
    if (!user) {
      location.replace("../login.html");
      return;
    }

    try {
      let snapshot;

      try {
        snapshot = await getDocs(query(
          collection(db, "announcements"),
          orderBy("createdAt", "desc")
        ));
      } catch {
        snapshot = await getDocs(collection(db, "announcements"));
      }

      if (snapshot.empty) {
        message.textContent = "لا توجد إعلانات حالياً.";
        return;
      }

      container.replaceChildren();

      snapshot.forEach(item => {
        const data = item.data();
        const card = document.createElement("article");
        card.className = "announcement";

        const title = document.createElement("h3");
        title.textContent = data.title || "إعلان جديد";

        const content = document.createElement("p");
        content.textContent =
          data.content || data.description || data.message || "";

        card.append(title, content);

        if (data.createdAt?.toDate) {
          const date = document.createElement("div");
          date.className = "date";
          date.textContent = data.createdAt.toDate().toLocaleDateString("ar-EG");
          card.appendChild(date);
        }

        container.appendChild(card);
      });

      message.textContent = "";

    } catch (error) {
      console.error(error);
      message.textContent = "حدث خطأ أثناء تحميل الإعلانات.";
    }
  });
</script></body>
</html>
