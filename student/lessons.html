<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الدروس | منصة التفوق</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { padding: 20px; }
    .container { max-width: 900px; margin: 25px auto; }
    .top {
      padding: 20px;
      border-radius: 20px;
      background: rgba(255,255,255,.2);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,.3);
      margin-bottom: 20px;
    }
    .lesson {
      padding: 20px;
      margin: 15px 0;
      border-radius: 18px;
      background: rgba(255,255,255,.2);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,.3);
    }
    .lesson h3 { margin-top: 0; }
    .lesson a {
      display: inline-block;
      margin: 8px 5px 0 0;
      padding: 10px 16px;
      border-radius: 10px;
      background: #3979c9;
      color: white;
      text-decoration: none;
    }
    .back {
      display: inline-block;
      margin-bottom: 15px;
      text-decoration: none;
    }
    #message { text-align: center; padding: 25px; }
  </style>
</head>
<body><main class="container">
  <a class="back" href="dashboard.html">⬅ العودة للوحة الطالب</a>  <header class="top">
    <h1>📚 الدروس</h1>
    <p>دروس الدراسات الاجتماعية المنشورة من الأستاذ</p>
  </header>  <div id="message">جاري تحميل الدروس...</div>
  <section id="lessons"></section>
</main><script type="module">
  import { auth, db } from "../firebase-config.js";

  import {
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

  import {
    collection,
    getDocs,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

  const message = document.getElementById("message");
  const lessonsContainer = document.getElementById("lessons");

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      location.replace("../login.html");
      return;
    }

    try {
      let snapshot;

      try {
        const lessonsQuery = query(
          collection(db, "lessons"),
          orderBy("createdAt", "desc")
        );
        snapshot = await getDocs(lessonsQuery);
      } catch {
        snapshot = await getDocs(collection(db, "lessons"));
      }

      lessonsContainer.replaceChildren();

      if (snapshot.empty) {
        message.textContent = "لا توجد دروس منشورة حتى الآن.";
        return;
      }

      snapshot.forEach((lessonDoc) => {
        const data = lessonDoc.data();

        const card = document.createElement("article");
        card.className = "lesson";

        const title = document.createElement("h3");
        title.textContent = data.title || data.name || "درس بدون عنوان";

        const description = document.createElement("p");
        description.textContent = data.description || data.content || "";

        card.append(title, description);

        const links = [
          { label: "📄 فتح ملف الدرس", url: data.pdfUrl || data.fileUrl },
          { label: "▶️ مشاهدة الفيديو", url: data.videoUrl || data.youtubeUrl },
          { label: "🔗 فتح الدرس", url: data.url || data.link }
        ];

        links.forEach(item => {
          if (!item.url) return;

          try {
            const parsed = new URL(item.url);
            if (parsed.protocol !== "https:") return;

            const link = document.createElement("a");
            link.href = parsed.href;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = item.label;
            card.appendChild(link);
          } catch {
            // تجاهل الروابط غير الصالحة
          }
        });

        lessonsContainer.appendChild(card);
      });

      message.textContent = "";

    } catch (error) {
      console.error(error);
      message.textContent =
        "تعذر تحميل الدروس. تأكد من إعدادات الاتصال وقواعد Firestore.";
    }
  });
</script></body>
</html>
