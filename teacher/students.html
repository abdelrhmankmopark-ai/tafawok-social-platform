<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الطلاب | منصة التفوق</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #0f172a;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 25px;
    }

    h1 {
      color: #38bdf8;
      font-size: 25px;
    }

    button, a {
      border: none;
      padding: 12px 17px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
    }

    .back {
      background: #334155;
      color: white;
    }

    .refresh {
      background: #2563eb;
      color: white;
    }

    .student-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .student-card h3 {
      color: #38bdf8;
      margin-top: 0;
    }

    .info {
      color: #cbd5e1;
      line-height: 1.9;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .status {
      display: inline-block;
      padding: 7px 13px;
      border-radius: 20px;
      margin: 10px 0;
      font-size: 13px;
    }

    .active {
      background: #14532d;
      color: #86efac;
    }

    .disabled {
      background: #7f1d1d;
      color: #fecaca;
    }

    .action-btn {
      width: 100%;
      margin-top: 12px;
      color: white;
    }

    .disable-btn {
      background: #dc2626;
    }

    .activate-btn {
      background: #16a34a;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      color: #facc15;
      margin: 20px 0;
      line-height: 1.8;
    }

    .empty {
      background: #1e293b;
      padding: 30px;
      text-align: center;
      border-radius: 15px;
      color: #cbd5e1;
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>👨‍🎓 إدارة الطلاب</h1>

    <div>
      <a href="dashboard.html" class="back">رجوع</a>
      <button class="refresh" id="refreshBtn">تحديث</button>
    </div>
  </header>

  <div id="message">جارٍ تحميل الطلاب...</div>

  <div id="studentsList"></div>

</div>

<script type="module">

import { auth, db } from "../firebase-config.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

import {
  collection,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";


const TEACHER_UID = "BjZsimAIgIUxSJDI8Z3K9huOO012";

const message = document.getElementById("message");
const studentsList = document.getElementById("studentsList");
const refreshBtn = document.getElementById("refreshBtn");

let currentUser = null;


onAuthStateChanged(auth, async (user) => {

  if (!user) {
    location.href = "../login.html";
    return;
  }

  if (user.uid !== TEACHER_UID) {
    message.textContent = "ليس لديك صلاحية دخول هذه الصفحة.";
    return;
  }

  currentUser = user;

  await loadStudents();

});


async function loadStudents() {

  message.textContent = "جارٍ تحميل الطلاب...";
  studentsList.innerHTML = "";

  try {

    const snapshot = await getDocs(
      collection(db, "students")
    );

    if (snapshot.empty) {

      message.textContent = "";

      studentsList.innerHTML = `
        <div class="empty">
          لا يوجد طلاب مسجلون حتى الآن.
        </div>
      `;

      return;
    }

    message.textContent = "";

    snapshot.forEach((studentDoc) => {

      const student = studentDoc.data();
      const studentId = studentDoc.id;

      const isActive = student.status === "active";

      const card = document.createElement("div");
      card.className = "student-card";

      const name = document.createElement("h3");
      name.textContent = student.name || "طالب بدون اسم";

      const info = document.createElement("div");
      info.className = "info";

      const email = document.createElement("p");
      email.textContent = "البريد الإلكتروني: " +
        (student.email || "غير مسجل");

      const uid = document.createElement("p");
      uid.textContent = "رقم الطالب: " + studentId;

      const status = document.createElement("span");
      status.className = "status " +
        (isActive ? "active" : "disabled");

      status.textContent = isActive
        ? "الحساب نشط"
        : "الحساب متوقف";

      const button = document.createElement("button");

      button.className = "action-btn " +
        (isActive ? "disable-btn" : "activate-btn");

      button.textContent = isActive
        ? "إيقاف حساب الطالب"
        : "تفعيل حساب الطالب";

      button.addEventListener("click", async () => {

        const newStatus = isActive ? "disabled" : "active";

        const action = isActive ? "إيقاف" : "تفعيل";

        if (!confirm("هل تريد " + action + " حساب هذا الطالب؟")) {
          return;
        }

        button.disabled = true;
        button.textContent = "جارٍ التحديث...";

        try {

          await updateDoc(
            doc(db, "students", studentId),
            {
              status: newStatus
            }
          );

          alert("تم تحديث حالة حساب الطالب بنجاح.");

          await loadStudents();

        } catch (error) {

          console.error(error);

          alert("حدث خطأ: " + error.message);

          button.disabled = false;

          button.textContent = isActive
            ? "إيقاف حساب الطالب"
            : "تفعيل حساب الطالب";

        }

      });

      info.appendChild(email);
      info.appendChild(uid);

      card.appendChild(name);
      card.appendChild(info);
      card.appendChild(status);
      card.appendChild(button);

      studentsList.appendChild(card);

    });

  } catch (error) {

    console.error(error);

    message.textContent =
      "تعذر تحميل الطلاب: " + error.message;

  }

}


refreshBtn.addEventListener("click", loadStudents);

</script>

</body>
</html>
