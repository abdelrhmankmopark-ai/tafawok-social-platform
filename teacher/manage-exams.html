<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الامتحانات | منصة التفوق</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #0f172a;
      color: white;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 25px;
      color: #38bdf8;
    }

    button, .back {
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      text-decoration: none;
    }

    .back {
      background: #334155;
      color: white;
    }

    .refresh {
      background: #2563eb;
      color: white;
    }

    .exam-card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    .exam-card h3 {
      margin-top: 0;
      color: #38bdf8;
      font-size: 20px;
    }

    .description {
      color: #cbd5e1;
      line-height: 1.7;
    }

    .info {
      color: #94a3b8;
      font-size: 14px;
      margin: 12px 0;
    }

    .status {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .published {
      background: #14532d;
      color: #86efac;
    }

    .draft {
      background: #713f12;
      color: #fde68a;
    }

    .publish-btn {
      background: #16a34a;
      color: white;
      width: 100%;
      margin-top: 10px;
    }

    .unpublish-btn {
      background: #dc2626;
      color: white;
      width: 100%;
      margin-top: 10px;
    }

    #message {
      text-align: center;
      color: #facc15;
      margin: 20px 0;
    }

    .empty {
      text-align: center;
      color: #94a3b8;
      padding: 35px 10px;
      background: #1e293b;
      border-radius: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>📚 إدارة الامتحانات</h1>

    <div>
      <a class="back" href="dashboard.html">رجوع</a>
      <button class="refresh" id="refreshBtn">تحديث</button>
    </div>
  </header>

  <div id="message">جارٍ تحميل الامتحانات...</div>

  <div id="examsList"></div>

</div>

<script type="module">

import { auth, db } from "../firebase-config.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

import {
  collection,
  getDocs,
  query,
  orderBy,
  updateDoc,
  doc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";


const TEACHER_UID = "BjZsimAIgIUxSJDI8Z3K9huOO012";

const message = document.getElementById("message");
const examsList = document.getElementById("examsList");
const refreshBtn = document.getElementById("refreshBtn");


onAuthStateChanged(auth, async (user) => {

  if (!user) {
    location.href = "../login.html";
    return;
  }

  if (user.uid !== TEACHER_UID) {
    message.textContent = "ليس لديك صلاحية دخول هذه الصفحة.";
    return;
  }

  await loadExams();

});


async function loadExams() {

  message.textContent = "جارٍ تحميل الامتحانات...";
  examsList.innerHTML = "";

  try {

    let snapshot;

    try {

      const examsQuery = query(
        collection(db, "exams"),
        orderBy("createdAt", "desc")
      );

      snapshot = await getDocs(examsQuery);

    } catch (error) {

      snapshot = await getDocs(
        collection(db, "exams")
      );

    }

    if (snapshot.empty) {

      message.textContent = "";
      examsList.innerHTML = `
        <div class="empty">
          لا توجد امتحانات حتى الآن.
        </div>
      `;

      return;
    }

    message.textContent = "";

    snapshot.forEach((examDoc) => {

      const exam = examDoc.data();
      const examId = examDoc.id;

      const isPublished = exam.isPublished === true;

      const card = document.createElement("div");
      card.className = "exam-card";

      const title = document.createElement("h3");
      title.textContent = exam.title || "امتحان بدون عنوان";

      const description = document.createElement("p");
      description.className = "description";
      description.textContent = exam.description || "لا يوجد وصف.";

      const status = document.createElement("span");
      status.className = "status " +
        (isPublished ? "published" : "draft");

      status.textContent = isPublished
        ? "منشور للطلاب"
        : "مسودة - غير منشور";

      const info = document.createElement("div");
      info.className = "info";

      const duration = Number(
        exam.durationMinutes || exam.duration || 0
      );

      info.textContent =
        "عدد الأسئلة: " + (exam.questionCount || 0) +
        " | المدة: " + duration + " دقيقة";

      const button = document.createElement("button");

      button.className = isPublished
        ? "unpublish-btn"
        : "publish-btn";

      button.textContent = isPublished
        ? "إلغاء النشر"
        : "نشر الامتحان للطلاب";

      button.addEventListener("click", async () => {

        const action = isPublished ? "إلغاء نشر" : "نشر";

        if (!confirm("هل تريد " + action + " هذا الامتحان؟")) {
          return;
        }

        button.disabled = true;
        button.textContent = "جارٍ التحديث...";

        try {

          await updateDoc(
            doc(db, "exams", examId),
            {
              isPublished: !isPublished,
              updatedAt: serverTimestamp()
            }
          );

          alert("تم تحديث حالة الامتحان بنجاح.");

          await loadExams();

        } catch (error) {

          console.error(error);

          alert("حدث خطأ أثناء تحديث الامتحان: " + error.message);

          button.disabled = false;
          button.textContent = isPublished
            ? "إلغاء النشر"
            : "نشر الامتحان للطلاب";

        }

      });

      card.appendChild(title);
      card.appendChild(status);
      card.appendChild(description);
      card.appendChild(info);
      card.appendChild(button);

      examsList.appendChild(card);

    });

  } catch (error) {

    console.error(error);

    message.textContent =
      "حدث خطأ أثناء تحميل الامتحانات: " + error.message;

  }

}


refreshBtn.addEventListener("click", loadExams);

</script>

</body>
</html>
