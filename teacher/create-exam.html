<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء امتحان | منصة التفوق</title><style>
*{box-sizing:border-box}
body{
 margin:0;
 padding:20px;
 background:#0b1220;
 color:white;
 font-family:Arial,sans-serif;
}
.container{max-width:850px;margin:25px auto}
header,.box,.question{
 background:#172235;
 border:1px solid #293950;
 border-radius:18px;
 padding:22px;
 margin-bottom:20px;
}
header{background:linear-gradient(135deg,#155eef,#7138e8)}
input,textarea,select{
 width:100%;
 padding:13px;
 margin:8px 0 15px;
 border:1px solid #34445e;
 border-radius:10px;
 background:#0b1220;
 color:white;
 font-size:15px;
}
label{font-weight:bold}
button{
 border:0;
 border-radius:10px;
 padding:13px 18px;
 cursor:pointer;
 font-size:15px;
 margin:5px;
}
.primary{background:#2563eb;color:white}
.secondary{background:#334155;color:white}
.delete{background:#dc3545;color:white}
.question h3{margin-top:0}
.option{
 display:grid;
 grid-template-columns:1fr 110px;
 gap:10px;
 align-items:center;
}
#message{
 padding:15px;
 border-radius:10px;
 margin:15px 0;
 display:none;
}
.success{background:#14532d}
.error{background:#7f1d1d}
.back{color:#93c5fd;text-decoration:none}
</style></head><body><main class="container"><a class="back" href="dashboard.html">⬅ لوحة المدرس</a>

<header>
<h1>📝 إنشاء امتحان جديد</h1>
<p>منصة التفوق للدراسات الاجتماعية</p>
</header><form id="examForm"><section class="box"><h2>بيانات الامتحان</h2><label>عنوان الامتحان</label>
<input id="title" required maxlength="150"
placeholder="مثلاً: امتحان الوحدة الأولى">

<label>وصف الامتحان</label>

<textarea id="description" rows="3"
placeholder="وصف مختصر للامتحان"></textarea><label>مدة الامتحان بالدقائق</label>
<input id="duration" type="number"
min="1" max="300" value="30" required>

</section><section class="box"><h2>أسئلة الامتحان</h2><div id="questions"></div><button type="button" class="secondary" id="addQuestion">
➕ إضافة سؤال
</button></section><button type="submit" class="primary" id="saveBtn">
💾 حفظ الامتحان كمسودة
</button><div id="message"></div></form></main><script type="module">

import {auth,db} from "../firebase-config.js";

import {
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

import {
 doc,
 collection,
 writeBatch,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const TEACHER_UID = "BjZsimAIgIUxSJDI8Z3K9huOO012";

const form = document.getElementById("examForm");
const questionsContainer = document.getElementById("questions");
const addButton = document.getElementById("addQuestion");
const saveButton = document.getElementById("saveBtn");
const message = document.getElementById("message");

let currentUser = null;
let questionCounter = 0;

onAuthStateChanged(auth,user=>{

 if(!user){
  location.replace("../login.html");
  return;
 }

 if(user.uid !== TEACHER_UID){
  document.body.innerHTML =
   "<h2 style='text-align:center'>ليس لديك صلاحية المدرس.</h2>";
  return;
 }

 currentUser = user;

 addQuestion();

});

function showMessage(text,type){

 message.textContent = text;
 message.className = type;
 message.style.display = "block";

}

function addQuestion(){

 questionCounter++;

 const number = questionCounter;

 const card = document.createElement("div");
 card.className = "question";

 card.dataset.number = number;

 card.innerHTML = `
 <h3>السؤال ${number}</h3>

 <label>نص السؤال</label>

 <textarea class="questionText"
 rows="2" required
 placeholder="اكتب السؤال هنا"></textarea><label>الاختيارات</label>

 <div class="option">
 <input class="choice" required maxlength="300"
 placeholder="الاختيار الأول">
 <span>الاختيار 1</span>
 </div> <div class="option">
 <input class="choice" required maxlength="300"
 placeholder="الاختيار الثاني">
 <span>الاختيار 2</span>
 </div> <div class="option">
 <input class="choice" required maxlength="300"
 placeholder="الاختيار الثالث">
 <span>الاختيار 3</span>
 </div> <div class="option">
 <input class="choice" required maxlength="300"
 placeholder="الاختيار الرابع">
 <span>الاختيار 4</span>
 </div><label>الإجابة الصحيحة</label>

 <select class="correctAnswer" required>
 <option value="0">الاختيار الأول</option>
 <option value="1">الاختيار الثاني</option>
 <option value="2">الاختيار الثالث</option>
 <option value="3">الاختيار الرابع</option>
 </select> <button type="button" class="delete">
 حذف السؤال
 </button>
 `;card.querySelector(".delete").addEventListener("click",()=>{

if(questionsContainer.children.length === 1){
alert("يجب أن يحتوي الامتحان على سؤال واحد على الأقل.");
return;
}

card.remove();
updateNumbers();

});

questionsContainer.appendChild(card);

updateNumbers();

}

function updateNumbers(){

[...questionsContainer.children].forEach((card,index)=>{

card.querySelector("h3").textContent =
"السؤال " + (index+1);

});

}

addButton.addEventListener("click",addQuestion);

form.addEventListener("submit",async event=>{

event.preventDefault();

if(!currentUser || currentUser.uid !== TEACHER_UID){
showMessage("غير مصرح لك بإنشاء الامتحان.","error");
return;
}

const title = document.getElementById("title").value.trim();

const description =
document.getElementById("description").value.trim();

const duration = Number(
document.getElementById("duration").value
);

if(!title){
showMessage("اكتب عنوان الامتحان.","error");
return;
}

if(!Number.isInteger(duration) || duration < 1 || duration > 300){
showMessage("مدة الامتحان يجب أن تكون بين دقيقة و300 دقيقة.","error");
return;
}

const cards = [...questionsContainer.children];

if(cards.length === 0){
showMessage("أضف سؤالاً واحداً على الأقل.","error");
return;
}

const questions = [];
const answers = {};

for(let i=0;i<cards.length;i++){

const card = cards[i];

const text = card.querySelector(".questionText").value.trim();

const options = [...card.querySelectorAll(".choice")]
.map(input=>input.value.trim());

const correct = Number(
card.querySelector(".correctAnswer").value
);

if(!text || options.some(option=>!option)){
showMessage("أكمل بيانات السؤال رقم "+(i+1),"error");
return;
}

questions.push({
id:"q"+(i+1),
text,
options
});

answers["q"+(i+1)] = correct;

}

saveButton.disabled = true;
saveButton.textContent = "جاري الحفظ...";

try{

const examRef = doc(collection(db,"exams"));

const answerRef = doc(db,"examAnswerKeys",examRef.id);

const batch = writeBatch(db);

batch.set(examRef,{

title,
description,
duration,
durationMinutes:duration,
questions,
questionCount:questions.length,
isPublished:false,
createdAt:serverTimestamp(),
updatedAt:serverTimestamp(),
createdBy:currentUser.uid

});

batch.set(answerRef,{

examId:examRef.id,
answers,
createdAt:serverTimestamp()

});

await batch.commit();

showMessage(
"تم حفظ الامتحان بنجاح كمسودة. رقم الامتحان: "+examRef.id,
"success"
);

form.reset();

document.getElementById("duration").value = 30;

questionsContainer.replaceChildren();

questionCounter = 0;

addQuestion();

}catch(error){

console.error("Exam creation error:",error);

showMessage(
"تعذر حفظ الامتحان. راجع اتصال الإنترنت وقواعد Firestore.",
"error"
);

}finally{

saveButton.disabled = false;
saveButton.textContent = "💾 حفظ الامتحان كمسودة";

}

});

</script></body>
</html>
