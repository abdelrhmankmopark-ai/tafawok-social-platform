<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة التفوق في الدراسات الاجتماعية</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f1f5fb;
      color: #183153;
    }

    header {
      background: #1455a0;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      margin: 5px;
      font-size: 25px;
    }

    header p {
      margin-bottom: 0;
    }

    .container {
      width: 92%;
      max-width: 440px;
      margin: 35px auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px #00000012;
    }

    h2 {
      text-align: center;
      color: #1455a0;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 9px 0;
      border: 1px solid #ccd5e2;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 9px;
      background: #1455a0;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0d407c;
    }

    .secondary {
      background: #e8f0fb;
      color: #1455a0;
    }

    .secondary:hover {
      background: #d5e4f8;
    }

    .hidden {
      display: none;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      line-height: 1.7;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #65758b;
    }
  </style>
</head>

<body>

<header>
  <h1>🏆 منصة التفوق</h1>
  <p>في الدراسات الاجتماعية</p>
  <p>الصف الثاني الإعدادي - الترم الأول</p>
</header>

<div class="container" id="welcome">
  <h2>أهلاً بك في منصة التفوق</h2>
  <p class="message">منصتك التعليمية لمراجعة دروس الدراسات الاجتماعية والتفوق فيها.</p>
  <button onclick="showPage('login')">تسجيل الدخول</button>
  <button class="secondary" onclick="showPage('register')">إنشاء حساب طالب</button>
</div>

<div class="container hidden" id="login">
  <h2>تسجيل الدخول</h2>

  <input id="loginEmail" type="email" placeholder="البريد الإلكتروني">
  <input id="loginPassword" type="password" placeholder="كلمة المرور">

  <button id="loginBtn">دخول</button>
  <button class="secondary" onclick="showPage('forgot')">نسيت كلمة المرور؟</button>
  <button class="secondary" onclick="showPage('welcome')">رجوع</button>

  <p class="message" id="loginMessage"></p>
</div>

<div class="container hidden" id="register">
  <h2>إنشاء حساب طالب</h2>

  <input id="registerName" type="text" placeholder="الاسم بالكامل">
  <input id="registerEmail" type="email" placeholder="البريد الإلكتروني">
  <input id="registerPassword" type="password" placeholder="كلمة المرور">

  <button id="registerBtn">إنشاء الحساب</button>
  <button class="secondary" onclick="showPage('welcome')">رجوع</button>

  <p class="message" id="registerMessage"></p>
</div>

<div class="container hidden" id="forgot">
  <h2>استعادة كلمة المرور</h2>

  <input id="forgotEmail" type="email" placeholder="البريد الإلكتروني">

  <button id="forgotBtn">إرسال رابط الاستعادة</button>
  <button class="secondary" onclick="showPage('login')">رجوع</button>

  <p class="message" id="forgotMessage"></p>
</div>

<div class="container hidden" id="student">
  <h2>أهلاً بك في المنصة 🎉</h2>
  <p class="message" id="studentName"></p>
  <button id="logoutBtn">تسجيل الخروج</button>
</div>

<footer>
  جميع الحقوق محفوظة © منصة التفوق
</footer>

<script type="module">

import { auth, db } from "./firebase-config.js";

import {
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  sendPasswordResetEmail,
  onAuthStateChanged,
  signOut,
  updateProfile
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

import {
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

window.showPage = function(page) {
  document.querySelectorAll(".container").forEach(element => {
    element.classList.add("hidden");
  });

  document.getElementById(page).classList.remove("hidden");
};

function showMessage(id, message, success = false) {
  const element = document.getElementById(id);
  element.textContent = message;
  element.style.color = success ? "green" : "red";
}

// إنشاء حساب طالب
document.getElementById("registerBtn").addEventListener("click", async () => {

  const name = document.getElementById("registerName").value.trim();
  const email = document.getElementById("registerEmail").value.trim();
  const password = document.getElementById("registerPassword").value;

  if (!name || !email || !password) {
    return showMessage("registerMessage", "من فضلك املأ جميع البيانات.");
  }

  if (password.length < 6) {
    return showMessage("registerMessage", "كلمة المرور يجب أن تكون 6 أحرف على الأقل.");
  }

  const button = document.getElementById("registerBtn");
  button.disabled = true;
  button.textContent = "جاري إنشاء الحساب...";

  try {
    const result = await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    await updateProfile(result.user, {
      displayName: name
    });

    await setDoc(doc(db, "students", result.user.uid), {
      name: name,
      email: email,
      createdAt: serverTimestamp(),
      status: "active"
    });

    showMessage("registerMessage", "تم إنشاء الحساب بنجاح!", true);

  } catch (error) {
    const errors = {
      "auth/email-already-in-use": "هذا البريد مسجل بالفعل.",
      "auth/invalid-email": "البريد الإلكتروني غير صحيح.",
      "auth/weak-password": "كلمة المرور ضعيفة.",
      "permission-denied": "صلاحيات قاعدة البيانات غير مجهزة بعد."
    };

    showMessage(
      "registerMessage",
      errors[error.code] || "حدث خطأ: " + error.message
    );

  } finally {
    button.disabled = false;
    button.textContent = "إنشاء الحساب";
  }
});

// تسجيل الدخول
document.getElementById("loginBtn").addEventListener("click", async () => {

  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  if (!email || !password) {
    return showMessage("loginMessage", "اكتب البريد وكلمة المرور.");
  }

  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (error) {
    showMessage("loginMessage", "تعذر تسجيل الدخول. راجع بياناتك.");
  }

});

// استعادة كلمة المرور
document.getElementById("forgotBtn").addEventListener("click", async () => {

  const email = document.getElementById("forgotEmail").value.trim();

  if (!email) {
    return showMessage("forgotMessage", "اكتب بريدك الإلكتروني.");
  }

  try {
    await sendPasswordResetEmail(auth, email);
    showMessage(
      "forgotMessage",
      "إذا كان البريد مسجلاً، ستصلك رسالة لاستعادة كلمة المرور.",
      true
    );
  } catch (error) {
    showMessage(
      "forgotMessage",
      "تعذر إرسال الرسالة. راجع البريد وحاول مرة أخرى."
    );
  }

});

// متابعة حالة تسجيل الدخول
onAuthStateChanged(auth, user => {

  if (user) {
    document.getElementById("studentName").textContent =
      "مرحباً " + (user.displayName || "بالطالب") +
      "، أنت مسجل الدخول.";

    showPage("student");

  } else {
    showPage("welcome");
  }

});

// تسجيل الخروج
document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
});

</script>

</body>
  </html>
